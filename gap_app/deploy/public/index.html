<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GAP — yuklab olish</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: linear-gradient(160deg, #0f766e 0%, #134e4a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #fff;
    }
    .card {
      background: #fff;
      color: #134e4a;
      border-radius: 20px;
      padding: 32px 28px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
    }
    h1 { font-size: 2rem; margin-bottom: 8px; }
    p { color: #64748b; font-size: .95rem; line-height: 1.5; margin-bottom: 24px; }
    a.btn {
      display: block;
      background: #0d9488;
      color: #fff;
      text-decoration: none;
      padding: 16px 24px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1.05rem;
    }
    a.btn:hover { background: #0f766e; }
    small { display: block; margin-top: 16px; color: #94a3b8; font-size: .8rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>GAP</h1>
    <p>Navbatli pul yig‘im ilovasi. Android telefonga o‘rnating (Play Store emas).</p>
    <a class="btn" href="gap.apk" download="gap.apk">APK yuklab olish</a>
    <small>O‘rnatish: Sozlamalar → Noma’lum manbalar → ruxsat bering.</small>
  </div>
</body>
</html>
